<div class="result flex-center fit" [ngClass]="{'as-result': data.title, 'as-item': !data.title}">
    <span>{{ data.number }}</span>
    @if (type === 'found') {
        <span>{{ data.title }}</span>
        <span class="pointer" title="iniciar" (click)="startPlayWith($event)">&#9658;</span>
        <span class="pointer" title="agregar a playlist" (click)="add($event)">&#10010;</span>
    } @else { <!-- playlist -->
        <span class="pointer" title="Quitar de la playlist" (click)="remove($event)">&#10008;</span>
    }    
</div>
